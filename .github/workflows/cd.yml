name: CD
on:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecommerce_user
          POSTGRES_PASSWORD: ecommerce123
          POSTGRES_DB: ecommerce_db_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt pytest pytest-cov httpx ruff
      - run: ruff check app/
      - run: pytest --cov=app/ -v -x
        env:
          DATABASE_URL: postgresql://ecommerce_user:ecommerce123@localhost:5433/ecommerce_db_test
          SECRET_KEY: test_secret_key_no_usar_en_produccion

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ecommerce-caps:latest
          build-args: |
            VITE_API_URL=/api
            VITE_IMGBB_KEY=${{ secrets.VITE_IMGBB_KEY }}
            VITE_WOMPI_PUBLIC_KEY=${{ secrets.VITE_WOMPI_PUBLIC_KEY }}
      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
